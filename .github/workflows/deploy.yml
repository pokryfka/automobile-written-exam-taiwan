name: Test and deploy

# Pull requests deploy to QA. Only release tags (v1.2.3) on main deploy to production;
# pushes to main run the tests.
# Each deploy first applies pending D1 migrations to that environment's database, and writes
# app/version.json so the app can show its version.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy-qa:
    # Pull requests from forks do not get the Cloudflare secrets, so they only run the tests.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: qa
      url: https://qa.car-exam.fyi
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/write_version.mjs qa ${{ github.event.pull_request.head.sha }}
      - run: npx wrangler d1 migrations apply car-exam-tw-qa --env qa --remote
      - run: npx wrangler deploy --env qa

  deploy-production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://car-exam.fyi
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: node tools/write_version.mjs production
      - run: npx wrangler d1 migrations apply car-exam-tw --remote
      - run: npx wrangler deploy
